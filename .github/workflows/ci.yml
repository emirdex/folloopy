name: Validate Folloopy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: folloopy_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: folloopy_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folloopy_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://folloopy_ci:ci_only_password@127.0.0.1:5432/folloopy_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
